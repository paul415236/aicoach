<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Garmin 跑步訓練儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  MathJax = { tex: { inlineMath: [['$','$']] }, options: { skipHtmlTags: ['script','style'] } };
</script>

  Chart.defaults.font.family = "'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif";

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Noto Sans TC", "Noto Sans CJK TC", "Noto Sans CJK SC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; background: #0f1117; color: #e2e8f0; }
  header { padding: 16px 32px; border-bottom: 1px solid #2d3748; display: flex; align-items: center; gap: 32px; }
  header h1 { font-size: 1.4rem; color: #63b3ed; white-space: nowrap; }
  .tabs { display: flex; gap: 4px; }
  .tab { padding: 6px 18px; border-radius: 6px; cursor: pointer; color: #718096; font-size: .9rem; }
  .tab.active { background: #2a4a6b; color: #63b3ed; }
  .tab:hover:not(.active) { background: #1a202c; color: #e2e8f0; }
  .ctrl { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .btn { padding: 6px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: .85rem; font-family: inherit; transition: opacity .15s; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn-sync { background: #2d6a4f; color: #b7e4c7; }
  .btn-ai   { background: #2a4a6b; color: #90cdf4; }
  .lang-toggle { display:flex; gap:3px; }
  .lang-toggle button { padding:4px 10px; border-radius:5px; border:1px solid #2d3748; background:#0f1117; color:#718096; cursor:pointer; font-size:.8rem; font-family:inherit; }
  .lang-toggle button.active { background:#2a4a6b; border-color:#63b3ed; color:#63b3ed; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4a5568; }
  .status-dot.running { background: #f6ad55; animation: pulse .8s infinite alternate; }
  .status-dot.ok  { background: #68d391; }
  .status-dot.err { background: #fc8181; }
  @keyframes pulse { from { opacity:.4 } to { opacity:1 } }
  #log-panel { background: #0d1117; border: 1px solid #2d3748; border-radius: 8px; padding: 12px 16px;
    font-family: monospace; font-size: .8rem; color: #a0aec0; max-height: 320px;
    overflow-y: auto; white-space: pre-wrap; display: none; margin-bottom: 16px; }
  .page { display: none; }
  .page.active { display: flex; }
  #list { width: 340px; overflow-y: auto; border-right: 1px solid #2d3748; }
  .run-item { padding: 14px 18px; border-bottom: 1px solid #1a202c; cursor: pointer; transition: background .15s; }
  .run-item:hover { background: #1a202c; }
  .run-item.active { background: #2a4a6b; border-left: 3px solid #63b3ed; }
  .run-item .date { font-size: .75rem; color: #718096; }
  .run-item .name { font-weight: 600; margin: 2px 0; }
  .run-item .stats { font-size: .8rem; color: #a0aec0; display: flex; gap: 12px; }
  #detail { flex: 1; padding: 24px 32px; overflow-y: auto; }
  #detail h2 { margin-bottom: 4px; }
  #detail .meta { color: #718096; font-size: .85rem; margin-bottom: 20px; display: flex; gap: 20px; flex-wrap: wrap; }
  #detail .meta span b { color: #e2e8f0; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .chart-box { background: #1a202c; border-radius: 10px; padding: 16px; }
  .chart-box h3 { font-size: .85rem; color: #a0aec0; margin-bottom: 12px; }
  .placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: #4a5568; font-size: 1rem; }
  #ai-page { padding: 32px; overflow-y: auto; flex-direction: column; width: 100%; box-sizing: border-box; }
  #ai-page .meta-bar { color: #718096; font-size: .8rem; margin-bottom: 24px; }
  #ai-content h1,#ai-content h2,#ai-content h3 { color: #63b3ed; margin: 1.2em 0 .4em; }
  #ai-content p { line-height: 1.8; margin-bottom: .8em; color: #cbd5e0; }
  #ai-content ul,#ai-content ol { padding-left: 1.4em; margin-bottom: .8em; color: #cbd5e0; line-height: 1.8; }
  #ai-content table { border-collapse: collapse; width: 100%; margin-bottom: 1em; }
  #ai-content th { background: #2a4a6b; color: #63b3ed; padding: 8px 12px; text-align: left; }
  #ai-content td { padding: 7px 12px; border-bottom: 1px solid #2d3748; color: #cbd5e0; }
  #ai-content tr:hover td { background: #1a202c; }
  #ai-content code { background: #1a202c; padding: 2px 6px; border-radius: 4px; font-size: .85em; }
  #ai-content strong { color: #e2e8f0; }
  /* Stats page */
  #stats-page { padding: 32px; overflow-y: auto; flex-direction: column; width: 100%; box-sizing: border-box; }
  #stats-page .meta-bar { color: #718096; font-size: .8rem; margin-bottom: 20px; }
  table.stats-table { border-collapse: collapse; width: 100%; font-size: .85rem; }
  table.stats-table th { background: #2a4a6b; color: #63b3ed; padding: 8px 10px; text-align: right; white-space: nowrap; }
  table.stats-table th:first-child { text-align: left; }
  table.stats-table td { padding: 7px 10px; border-bottom: 1px solid #2d3748; color: #cbd5e0; text-align: right; white-space: nowrap; }
  table.stats-table td:first-child { text-align: left; color: #e2e8f0; }
  table.stats-table tr:hover td { background: #1a202c; }
  table.stats-table tfoot td { font-weight: bold; color: #e2e8f0; border-top: 2px solid #2d3748; }
  .cat-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  .period-toggle { display: inline-flex; gap: 4px; margin-bottom: 12px; background: #1a202c; padding: 4px; border-radius: 8px; }
  .period-toggle button { background: transparent; color: #a0aec0; border: none; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: .85rem; }
  .period-toggle button.active { background: #2a4a6b; color: #63b3ed; font-weight: bold; }
  /* 方案A：統一卡片 + 儀表板網格 */
  .stats-dashboard { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; gap: 20px; align-items: stretch; }
  @media (max-width: 860px) { .stats-dashboard { grid-template-columns: 1fr; } }
  .stats-card { background: #1a202c; border: 1px solid #2d3748; border-radius: 12px; padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.25); display: flex; flex-direction: column; }
  .stats-card h3 { color: #63b3ed; font-size: .95rem; margin: 0 0 14px; }
  .stats-card.span-all { grid-column: 1 / -1; }
  .stats-card .card-pie { max-width: 360px; margin: 0 auto; width: 100%; }
  .stats-card .card-note { color: #718096; font-size: .78rem; line-height: 1.6; margin-top: 12px; }
  .stats-card .card-table-wrap { flex: 1; overflow-x: auto; }
  .stats-card .card-trend { position: relative; height: 300px; }
  .stats-card .card-trend canvas { max-height: 300px; }
  /* Modal */
  #analyze-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; align-items:center; justify-content:center; }
  #analyze-modal.open { display:flex; }
  .modal-box { background:#1a202c; border:1px solid #2d3748; border-radius:12px; padding:28px 32px; width:460px; max-width:95vw; }
  .modal-box h2 { font-size:1.1rem; color:#63b3ed; margin-bottom:20px; display:flex; align-items:center; justify-content:space-between; }
  .modal-field { margin-bottom:16px; }
  .modal-field label { display:block; font-size:.82rem; color:#a0aec0; margin-bottom:6px; }
  .modal-field select, .modal-field textarea { width:100%; background:#0f1117; border:1px solid #2d3748; border-radius:6px; color:#e2e8f0; padding:8px 10px; font-family:inherit; font-size:.88rem; }
  .modal-field textarea { resize:vertical; min-height:80px; }
  .day-picker { display:flex; gap:6px; flex-wrap:wrap; }
  .day-btn { padding:5px 10px; border-radius:6px; border:1px solid #2d3748; background:#0f1117; color:#a0aec0; cursor:pointer; font-size:.82rem; transition:all .15s; font-family:inherit; }
  .day-btn.selected { background:#2a4a6b; border-color:#63b3ed; color:#63b3ed; }
  .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  #mfa-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:200; align-items:center; justify-content:center; }
  #mfa-modal.open { display:flex; }
  #mfa-modal .modal-box { width:360px; }
  #mfa-input { width:100%; background:#0f1117; border:1px solid #2d3748; border-radius:6px; color:#e2e8f0; padding:10px 12px; font-family:inherit; font-size:1.1rem; letter-spacing:3px; text-align:center; }
  #mfa-error { color:#fc8181; font-size:.8rem; margin-top:8px; min-height:1em; }
</style>
</head>
<body>
<header>
  <h1 id="hdr-title">Garmin 跑步訓練儀表板</h1>
  <div class="tabs">
    <div class="tab active" id="tab-training" onclick="switchTab('training')">訓練紀錄</div>
    <div class="tab" id="tab-stats" onclick="switchTab('stats')">訓練統計</div>
    <div class="tab" id="tab-ai" onclick="switchTab('ai')">AI 教練建議</div>
  </div>
  <div class="ctrl">
    <div class="lang-toggle">
      <button id="glang-zh" onclick="setLang('zh')">中文</button>
      <button id="glang-en" onclick="setLang('en')">EN</button>
    </div>
    <div class="status-dot" id="status-dot"></div>
    <button class="btn btn-sync" id="btn-sync" onclick="runJob('sync')">🔄 同步 Garmin</button>
    <button class="btn btn-ai"   id="btn-ai"   onclick="runJob('analyze')">🤖 AI 分析</button>
  </div>
</header>

<div id="analyze-modal">
  <div class="modal-box">
    <h2><span>🤖 <span id="modal-title">AI 分析設定</span></span></h2>
    <div class="modal-field">
      <label id="lbl-coach">訓練哲學教練</label>
      <select id="cfg-coach">
        <option value="auto">🤖 Auto — 依你的訓練框架個人化規劃（不套流派）</option>
        <option value="daniels">Jack Daniels — 科學化配速區間（E/M/T/I/R）</option>
        <option value="hansons">Hansons — 累積疲勞累積里程，強調 SOS 課</option>
        <option value="lydiard">Lydiard — 有氧基礎週期化金字塔</option>
      </select>
    </div>
    <div class="modal-field">
      <label id="lbl-race-date">目標賽事日期</label>
      <input id="cfg-race-date" type="date">
    </div>
    <div class="modal-field">
      <label id="lbl-race-type">目標賽事類型</label>
      <select id="cfg-race-type">
        <option value="">未設定</option>
        <option value="5K">5K</option>
        <option value="10K">10K</option>
        <option value="Half">半程馬拉松 (Half Marathon)</option>
        <option value="Full">全程馬拉松 (Full Marathon)</option>
      </select>
    </div>
    <div class="modal-field">
      <label id="lbl-race-goal">目標完賽時間 (HH:MM:SS)</label>
      <input id="cfg-race-goal" type="text" inputmode="numeric" placeholder="例：02:54:00"
             pattern="^\d{1,2}:\d{2}:\d{2}$">
    </div>
    <div class="modal-field">
      <label id="lbl-lookback">歷史紀錄參考範圍 (個月)</label>
      <select id="cfg-lookback">
        <option value="1">1 個月</option>
        <option value="3">3 個月</option>
        <option value="6">6 個月</option>
        <option value="12">12 個月</option>
        <option value="0">全部紀錄</option>
      </select>
    </div>
    <div class="modal-field">
      <label id="lbl-rest">固定休息日（可複選）</label>
      <div class="day-picker" id="cfg-rest"></div>
    </div>
    <div class="modal-field">
      <label id="lbl-lsd">LSD 長跑日（可複選）</label>
      <div class="day-picker" id="cfg-lsd"></div>
    </div>
    <div class="modal-field">
      <label id="lbl-note">補充訊息（近況、傷痛、目標賽事…）</label>
      <textarea id="cfg-note" placeholder="例：右膝略緊，10月有半馬比賽，本週總里程偏低…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" style="background:#2d3748;color:#a0aec0" id="btn-reset-modal" onclick="resetModal()">↺ 重置</button>
      <button class="btn" style="background:#2d3748;color:#a0aec0" id="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn btn-ai" id="btn-start" onclick="submitAnalyze()">開始分析</button>
    </div>
  </div>
</div>

<div id="mfa-modal">
  <div class="modal-box">
    <h2><span>🔐 <span id="mfa-title">MFA 驗證</span></span></h2>
    <div class="modal-field">
      <label id="mfa-label">請輸入 Garmin 傳送的驗證碼</label>
      <input id="mfa-input" type="text" inputmode="numeric" autocomplete="one-time-code"
             maxlength="10" placeholder="000000" onkeydown="if(event.key==='Enter')submitMfa()">
      <div id="mfa-error"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ai" id="mfa-submit" onclick="submitMfa()">送出</button>
    </div>
  </div>
</div>

<div id="log-panel"></div>
<div id="training-page" class="page active" style="height:calc(100vh - 61px)">
  <div id="list"><div class="placeholder" style="padding:40px" id="list-loading">載入中...</div></div>
  <div id="detail"><div class="placeholder" id="detail-placeholder">選擇左側活動查看詳細圖表</div></div>
</div>
<div id="ai-page" class="page">
  <div class="meta-bar" id="ai-meta"></div>
  <div id="ai-content"><div class="placeholder" style="padding:40px;color:#4a5568" id="ai-placeholder">載入中...</div></div>
</div>
<div id="stats-page" class="page">
  <div class="meta-bar" id="stats-meta"></div>
  <div id="stats-content">
    <div class="placeholder" style="padding:40px;color:#4a5568" id="stats-placeholder">載入中...</div>
  </div>
</div>

async function loadRuns() {

function renderList() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  _runs.forEach(r => {
    const el = document.createElement('div');
    el.className = 'run-item';
    el.dataset.id = r.activity_id;
    el.innerHTML = `
      <div class="date">${r.date}</div>
      <div class="name">${r.name}</div>
      <div class="stats">
        <span>📏 ${r.distance_km} km</span>
        <span>⏱ ${r.duration_mins} min</span>

async function loadDetail(run, el) {
  document.querySelectorAll('.run-item').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  const t = T[_lang];

  const res = await fetch(`/api/runs/${run.activity_id}/splits`);
  const splits = await res.json();

  const detail = document.getElementById('detail');
  detail.innerHTML = `
    <h2>${run.name}</h2>
    <div class="meta">
      <span>📅 <b>${run.date}</b></span>
      <span>📏 <b>${run.distance_km} km</b></span>
      <span>⏱ <b>${run.duration_mins} min</b></span>
      <span>💓 ${t.metaAvg} <b>${run.avg_hr ?? '--'}</b> / ${t.metaMax} <b>${run.max_hr ?? '--'}</b> bpm</span>
      <span>🏃 ${t.metaPace} <b>${run.avg_pace}</b></span>
      <span>👟 ${t.metaCadence} <b>${run.avg_cadence ?? '--'}</b> spm</span>
      ${run.training_effect ? `<span>⚡ ${t.metaEffect} <b>${run.training_effect}</b></span>` : ''}
    </div>
    <div class="charts">
      <div class="chart-box"><h3>${t.chartPace}</h3><canvas id="cPace"></canvas></div>
      <div class="chart-box"><h3>${t.chartHR}</h3><canvas id="cHR"></canvas></div>
      <div class="chart-box"><h3>${t.chartCad}</h3><canvas id="cCad"></canvas></div>
      <div class="chart-box"><h3>${t.chartCombo}</h3><canvas id="cDist"></canvas></div>
    </div>`;

  if (!splits.length) return;

  const labels = splits.map(s => t.lapLabel(s.lap));
  const paceToSec = p => {
    if (!p || p === 'N/A') return null;
    const [m, s] = p.split(':').map(Number);
    return m * 60 + s;
  };
  const secToLabel = s => s ? `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}` : null;
  const chartOpts = () => ({
    responsive: true,
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { color: '#718096' }, grid: { color: '#2d3748' } },
      y: { ticks: { color: '#718096' }, grid: { color: '#2d3748' } }
    }
  });

  const paceSecs = splits.map(s => paceToSec(s.avg_pace));
  const maxPace = Math.max(...paceSecs.filter(Boolean));

  // 計算平均值（忽略 null/0），並產生一條等值的水平線資料
  const average = arr => {
    const v = arr.filter(x => x != null && !isNaN(x) && x !== 0);
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
  };
  const avgLineDataset = (arr, color, label) => {
    const avg = average(arr);
    if (avg == null) return null;
    return {
      label: `${label} ${t.avgLine}`,
      type: 'line',
      data: labels.map(() => avg),
      borderColor: color,
      borderDash: [6, 4],
      borderWidth: 2,
      pointRadius: 0,
      fill: false,
      tension: 0,
      order: 0
    };
  };

  const paceAvg = avgLineDataset(paceSecs, '#ffffff', t.comboPace);
  new Chart(document.getElementById('cPace'), {
    data: { labels, datasets: [
      { type: 'bar', label: t.comboPace, data: paceSecs, backgroundColor: '#63b3ed88', borderColor: '#63b3ed', borderWidth: 1, order: 1 },
      ...(paceAvg ? [paceAvg] : [])
    ] },
    options: { ...chartOpts(),
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: true, labels: { color: '#a0aec0', boxWidth: 12 } },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${secToLabel(Math.round(c.parsed.y))}` } }
      },
      scales: {
        x: { ticks: { color: '#718096' }, grid: { color: '#2d3748' } },
        y: { min: 0, max: Math.ceil(maxPace/60)*60, ticks: { color: '#718096', callback: v => secToLabel(v) }, grid: { color: '#2d3748' } }
      }
    }
  });
  const hrData = splits.map(s=>s.avg_hr);
  const hrAvg = avgLineDataset(hrData, '#ffffff', t.comboHR);
  new Chart(document.getElementById('cHR'), {
    type: 'line',
    data: { labels, datasets: [
      { label: t.comboHR, data: hrData, borderColor:'#fc8181', backgroundColor:'#fc818133', tension:.3, fill:true, pointRadius:4, order: 1 },
      ...(hrAvg ? [hrAvg] : [])
    ] },
    options: { ...chartOpts(),
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: true, labels: { color: '#a0aec0', boxWidth: 12 } },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${Math.round(c.parsed.y)}` } }
      }
    }
  });
  const cadData = splits.map(s=>s.avg_cadence);
  const cadAvg = avgLineDataset(cadData, '#ffffff', t.comboCad);
  new Chart(document.getElementById('cCad'), {
    type: 'line',
    data: { labels, datasets: [
      { label: t.comboCad, data: cadData, borderColor:'#68d391', backgroundColor:'#68d39133', tension:.3, fill:true, pointRadius:4, order: 1 },
      ...(cadAvg ? [cadAvg] : [])
    ] },
    options: { ...chartOpts(),
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: true, labels: { color: '#a0aec0', boxWidth: 12 } },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${Math.round(c.parsed.y)}` } }
      }
    }
  });
  new Chart(document.getElementById('cDist'), {
    type: 'line',
    data: { labels, datasets: [
      { label: t.comboPace, type:'bar', data: paceSecs, backgroundColor:'#63b3ed55', borderColor:'#63b3ed', borderWidth:1, yAxisID:'yPace' },
      { label: t.comboHR,   data: splits.map(s=>s.avg_hr), borderColor:'#fc8181', backgroundColor:'transparent', tension:.3, pointRadius:4, yAxisID:'yHR' },
      { label: t.comboCad,  data: splits.map(s=>s.avg_cadence), borderColor:'#68d391', backgroundColor:'transparent', tension:.3, pointRadius:4, yAxisID:'yHR' }
    ]},
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#a0aec0', boxWidth: 12 } } },
      scales: {
        x: { ticks: { color: '#718096' }, grid: { color: '#2d3748' } },
        yPace: { position:'left', min:0, max:Math.ceil(maxPace/60)*60, ticks:{ color:'#63b3ed', callback: v=>secToLabel(v) }, grid:{ color:'#2d3748' } },
        yHR:   { position:'right', ticks:{ color:'#a0aec0' }, grid:{ display:false } }
      }
    }
  });
}

// 類別固定顏色（對應 easy/tempo/interval/long/other）
const STATS_CAT_COLORS = {
  easy:     '#68d391',  // 綠：輕鬆跑
  tempo:    '#f6ad55',  // 橘：節奏跑
  interval: '#fc8181',  // 紅：間歇跑
  long:     '#63b3ed',  // 藍：長跑
  other:    '#a0aec0',  // 灰：其他
};
let _statsCharts = [];   // 保存圖表實例以便重繪時銷毀
let _statsPie = null;    // 圓餅圖實例（會隨期間切換頻繁重繪，單獨管理）
let _statsData = null;   // 保存最近一次 API 資料
let _statsPeriod = 'week';  // 各類別統計的期間：week | month | all

function _catLabel(t, cat) {
  return { easy: t.catEasy, tempo: t.catTempo, interval: t.catInterval,
           long: t.catLong, other: t.catOther }[cat] || cat;
}

async function loadStats() {
  const t = T[_lang];
  const content = document.getElementById('stats-content');
  document.getElementById('stats-meta').textContent = '';
  // 銷毀舊圖表避免 canvas 重用衝突
  _statsCharts.forEach(c => c.destroy());
  _statsCharts = [];
  if (_statsPie) { _statsPie.destroy(); _statsPie = null; }

  try {
    const res = await fetch('/api/weekly-stats');
    _statsData = await res.json();
  } catch (e) {
    content.innerHTML = `<div class="placeholder" style="padding:40px;color:#4a5568">${t.connError}</div>`;
    return;
  }

  const data = _statsData;
  if (!data.weeks || !data.weeks.length) {
    content.innerHTML = `<div class="placeholder" style="padding:40px;color:#4a5568">${t.statsEmpty}</div>`;
    return;
  }

  const cats = data.categories;  // ["easy","tempo","interval","long","other"]
  const mpStr = `${Math.floor(data.mp_sec/60)}:${String(Math.round(data.mp_sec%60)).padStart(2,'0')}`;
  document.getElementById('stats-meta').textContent = t.statsMeta(mpStr, data.hrmax);

  // ── 建立 DOM 骨架（方案A：統一卡片 + 儀表板網格）──
  content.innerHTML = `
    <div class="stats-dashboard">
      <div class="stats-card">
        <h3>${t.statsOverallTitle}</h3>
        <div class="period-toggle">
          <button data-period="week"  onclick="setStatsPeriod('week')">${t.statsPeriodWeek}</button>
          <button data-period="month" onclick="setStatsPeriod('month')">${t.statsPeriodMonth}</button>
          <button data-period="all"   onclick="setStatsPeriod('all')">${t.statsPeriodAll}</button>
          <select id="stats-period-select" onchange="onStatsPeriodSelect(this.value)"
                  style="margin-left:8px;background:#0f1620;color:#cbd5e0;border:1px solid #2d3748;border-radius:6px;padding:5px 10px;font-size:.85rem;display:none"></select>
        </div>
        <h4 id="stats-pie-title" style="font-size:.85rem;color:#a0aec0;text-align:center;margin-bottom:10px">${t.statsPieKm}</h4>
        <div class="card-pie"><canvas id="statsPieKm"></canvas></div>
        <p class="card-note">${t.statsOtherNote}</p>
      </div>
      <div class="stats-card">
        <h3>${t.statsOverallTableTitle}</h3>
        <div class="card-table-wrap" id="stats-cat-table"></div>
      </div>
      <div class="stats-card span-all">
        <h3>${t.statsTrendTitle}</h3>
        <div class="card-trend"><canvas id="statsTrend"></canvas></div>
      </div>
    </div>`;

  // ── 每週總跑量趨勢圖（由舊到新）+ 平均線 + 線性回歸趨勢線 ──
  const weekKm = data.weeks.map(w => w.total_km);
  const n = weekKm.length;
  const avgKm = n ? weekKm.reduce((a, b) => a + b, 0) / n : 0;
  // 線性回歸（最小平方法）：x 用索引 0..n-1
  let growthData = [];
  if (n >= 2) {
    const xMean = (n - 1) / 2;
    const yMean = avgKm;
    let num = 0, den = 0;
    weekKm.forEach((y, x) => { num += (x - xMean) * (y - yMean); den += (x - xMean) ** 2; });
    const slope = den ? num / den : 0;
    const intercept = yMean - slope * xMean;
    growthData = weekKm.map((_, x) => Math.max(0, intercept + slope * x));
  }
  const trendChart = new Chart(document.getElementById('statsTrend'), {
    data: { labels: data.weeks.map(w => w.week), datasets: [
      { type: 'bar', label: t.statsTrendKm, data: weekKm,
        backgroundColor: '#63b3ed88', borderColor: '#63b3ed', borderWidth: 1, order: 3 },
      { type: 'line', label: t.statsTrendAvg, data: weekKm.map(() => avgKm),
        borderColor: '#ffffff', borderDash: [6, 4], borderWidth: 2, pointRadius: 0, fill: false, tension: 0, order: 1 },
      ...(growthData.length ? [{
        type: 'line', label: t.statsTrendGrowth, data: growthData,
        borderColor: '#68d391', borderWidth: 2, pointRadius: 0, fill: false, tension: 0, order: 2 }] : [])
    ] },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: true, labels: { color: '#a0aec0', boxWidth: 12 } },
        tooltip: { callbacks: { title: items => {
          const w = data.weeks[items[0].dataIndex];
          return `${w.week} (${w.start})`;
        }, label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)} km` } }
      },
      scales: {
        x: { ticks: { color: '#718096', maxRotation: 90, minRotation: 45, autoSkip: true, maxTicksLimit: 20 }, grid: { color: '#2d3748' } },
        y: { beginAtZero: true, ticks: { color: '#718096' }, grid: { color: '#2d3748' } }
      }
    }
  });
  _statsCharts.push(trendChart);

  // ── 圓餅圖 + 各類別統計表格（依目前期間）──
  renderStatsCategory();
}

// 目前週/月 期間所選的索引（指向 weeks/months 陣列）
let _statsPeriodIdx = null;

// 切換週/月/全期間
function setStatsPeriod(period) {
  _statsPeriod = period;
  _statsPeriodIdx = null;  // 重設為該期間的最新一筆
  renderStatsCategory();
}

// 下拉選單選擇某一週/某一月
function onStatsPeriodSelect(idx) {
  _statsPeriodIdx = parseInt(idx);
  renderStatsCategory();
}

// 建立（或重建）跑量比例圓餅圖
function renderStatsPie(catsData, titleLabel) {
  const t = T[_lang];
  const data = _statsData;
  const cats = data.categories;
  // 銷毀舊的圓餅圖（_statsCharts[0] 固定為圓餅圖）
  if (_statsPie) { _statsPie.destroy(); _statsPie = null; }
  const titleEl = document.getElementById('stats-pie-title');
  if (titleEl) titleEl.textContent = titleLabel;
  _statsPie = new Chart(document.getElementById('statsPieKm'), {
    type: 'doughnut',
    data: { labels: cats.map(c => _catLabel(t, c)),
            datasets: [{ data: cats.map(c => catsData[c].km),
            backgroundColor: cats.map(c => STATS_CAT_COLORS[c]),
            borderColor: '#1a202c', borderWidth: 2 }] },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'bottom', labels: { color: '#a0aec0', boxWidth: 12, padding: 10 } },
        tooltip: { callbacks: { label: ctx => {
          const total = ctx.dataset.data.reduce((a,b)=>a+b,0);
          const pct = total ? (ctx.parsed/total*100).toFixed(1) : 0;
          return `${ctx.label}: ${ctx.parsed.toFixed(1)} km (${pct}%)`;
        } } }
      }
    }
  });
}

// 依 _statsPeriod（與所選期間）渲染圓餅圖、下拉選單與統計表格
function renderStatsCategory() {
  if (!_statsData) return;
  const t = T[_lang];
  const data = _statsData;
  const cats = data.categories;

  // 高亮目前的期間按鈕
  document.querySelectorAll('.period-toggle button').forEach(b =>
    b.classList.toggle('active', b.dataset.period === _statsPeriod));

  const table = document.getElementById('stats-cat-table');
  const sel = document.getElementById('stats-period-select');
  if (!table || !sel) return;

  // 產生「單一期間的各類別彙總表」
  const renderCatTable = (catsData, totalKm, totalMins) => {
    const rows = cats.map(c => `
      <tr>
        <td><span class="cat-dot" style="background:${STATS_CAT_COLORS[c]}"></span>${_catLabel(t, c)}</td>
        <td>${catsData[c].km.toFixed(1)}</td>
        <td>${catsData[c].km_pct.toFixed(1)}%</td>
        <td>${Math.round(catsData[c].mins)}</td>
        <td>${catsData[c].mins_pct.toFixed(1)}%</td>
      </tr>`).join('');
    table.innerHTML = `
      <table class="stats-table">
        <thead><tr>
          <th>${t.statsColCat}</th><th>${t.statsColKm}</th><th>${t.statsColKmPct}</th>
          <th>${t.statsColMins}</th><th>${t.statsColMinsPct}</th>
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr>
          <td>${t.statsTotal}</td><td>${totalKm.toFixed(1)}</td><td>100%</td>
          <td>${Math.round(totalMins)}</td><td>100%</td>
        </tr></tfoot>
      </table>`;
  };

  if (_statsPeriod === 'all') {
    // 全期間：隱藏下拉，圓餅圖與表格用整體彙總
    sel.style.display = 'none';
    renderStatsPie(data.overall.cats, `${t.statsPieKm} — ${t.statsPeriodAll}`);
    renderCatTable(data.overall.cats, data.overall.total_km, data.overall.total_mins);
    return;
  }

  // 週 / 月：顯示下拉選單選擇哪一個期間（預設最新）
  const isWeek = _statsPeriod === 'week';
  const periods = isWeek ? data.weeks : data.months;
  const keyField = isWeek ? 'week' : 'month';

  // 預設選最新一筆（陣列最後一筆）
  if (_statsPeriodIdx == null || _statsPeriodIdx < 0 || _statsPeriodIdx >= periods.length) {
    _statsPeriodIdx = periods.length - 1;
  }
  // 下拉選項：由新到舊
  sel.style.display = '';
  sel.innerHTML = periods.map((p, i) =>
    `<option value="${i}" ${i === _statsPeriodIdx ? 'selected' : ''}>${p[keyField]}（${p.start}）</option>`
  ).reverse().join('');

  const p = periods[_statsPeriodIdx];
  const periodName = isWeek ? t.statsPeriodWeek : t.statsPeriodMonth;
  renderStatsPie(p.cats, `${t.statsPieKm} — ${p[keyField]}`);
  renderCatTable(p.cats, p.total_km, p.total_mins);
}

// ── Jobs ──────────────────────────────────────────────────
async function runJob(type) {
  if (type === 'analyze') { openModal(); return; }
  await _runJob(type, { lang: _lang });
}

async function _runJob(type, config) {
  const dot = document.getElementById('status-dot');
  const panel = document.getElementById('log-panel');
  const btnSync = document.getElementById('btn-sync');
  const btnAI   = document.getElementById('btn-ai');

  dot.className = 'status-dot running';
  btnSync.disabled = btnAI.disabled = true;
  panel.style.display = 'block';
  panel.textContent = '';
  if (type === 'analyze') switchTab('ai');

  const appendLog = line => { panel.textContent += line + '\n'; panel.scrollTop = panel.scrollHeight; };

  try {
    const fetchOpts = { method: 'POST' };
    if (config) { fetchOpts.headers = {'Content-Type':'application/json'}; fetchOpts.body = JSON.stringify(config); }
    const res = await fetch(`/api/${type}`, fetchOpts);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        if (part.startsWith('event: done')) {
          dot.className = 'status-dot ok';
          if (type === 'sync') loadRuns();
          if (type === 'analyze') loadAIPlan();
          setTimeout(() => { panel.style.display = 'none'; }, 3000);
        } else if (part.startsWith('event: mfa')) {
          const m = part.match(/data: (.*)$/s);
          if (m) {
            try { openMfa(JSON.parse(m[1])); } catch (e) { appendLog('❌ MFA parse error: ' + e); }
          }
        } else if (part.startsWith('data: ')) {
          appendLog(part.slice(6));
        }
      }
    }
  } catch (e) {
    appendLog(`❌ ${T[_lang].connError}: ${e}`);
    dot.className = 'status-dot err';
  } finally {
    btnSync.disabled = btnAI.disabled = false;
  }
}

// ── MFA ───────────────────────────────────────────────────
let _mfaSession = null;
function openMfa(payload) {
  _mfaSession = payload.session_id;
  const input = document.getElementById('mfa-input');
  document.getElementById('mfa-error').textContent = '';
  input.value = '';
  document.getElementById('mfa-modal').classList.add('open');
  setTimeout(() => input.focus(), 50);
}
function closeMfa() {
  document.getElementById('mfa-modal').classList.remove('open');
  _mfaSession = null;
}
async function submitMfa() {
  const input = document.getElementById('mfa-input');
  const errEl = document.getElementById('mfa-error');
  const code = input.value.trim();
  if (!code) { errEl.textContent = T[_lang].mfaEmpty; return; }
  if (!_mfaSession) { errEl.textContent = 'session expired'; return; }
  const btn = document.getElementById('mfa-submit');
  btn.disabled = true;
  try {
    const res = await fetch('/api/mfa', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: _mfaSession, code })
    });
    const j = await res.json();
    if (j.ok) { closeMfa(); }
    else { errEl.textContent = j.error || 'submit failed'; }
  } catch (e) {
    errEl.textContent = String(e);
  } finally {
    btn.disabled = false;
  }
}

// ── Modal ─────────────────────────────────────────────────
function initDayPicker(id, defaultSelected) {
  const el = document.getElementById(id);
  T.zh.days.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (defaultSelected.includes(i) ? ' selected' : '');
    btn.textContent = T[_lang].days[i];
    btn.dataset.i = i;
    btn.onclick = () => btn.classList.toggle('selected');
    el.appendChild(btn);
  });
}

function getSelected(id) {
  return [...document.querySelectorAll(`#${id} .day-btn.selected`)].map(b => parseInt(b.dataset.i));
}

function applyConfig(cfg) {
  document.getElementById('cfg-coach').value = cfg.coach || 'daniels';
  document.getElementById('cfg-race-date').value = cfg.race_date || '';
  document.getElementById('cfg-race-type').value = cfg.race_type || '';
  document.getElementById('cfg-race-goal').value = cfg.race_goal || '';
  document.getElementById('cfg-lookback').value = cfg.lookback_months ?? 3;
  document.getElementById('cfg-note').value  = cfg.note  || '';
  const restDays = cfg.rest_days ?? [1,5];
  const lsdDays  = cfg.lsd_days  ?? [0];
  document.querySelectorAll('#cfg-rest .day-btn').forEach(b => b.classList.toggle('selected', restDays.includes(parseInt(b.dataset.i))));
  document.querySelectorAll('#cfg-lsd .day-btn').forEach(b =>  b.classList.toggle('selected', lsdDays.includes(parseInt(b.dataset.i))));
}

async function openModal() {
  try {
    const res = await fetch('/api/analyze-config');
    if (res.ok) applyConfig(await res.json());
  } catch {}
  document.getElementById('analyze-modal').classList.add('open');
}

function resetModal() {
  applyConfig({ coach:'daniels', race_date:'', race_type:'', race_goal:'', lookback_months:3, rest_days:[1,5], lsd_days:[0], note:'', lang: _lang });
}

function closeModal() {
  document.getElementById('analyze-modal').classList.remove('open');
}

function submitAnalyze() {
  closeModal();
  const config = {
    coach: document.getElementById('cfg-coach').value,
    race_date: document.getElementById('cfg-race-date').value,
    race_type: document.getElementById('cfg-race-type').value,
    race_goal: document.getElementById('cfg-race-goal').value.trim(),
    lookback_months: parseInt(document.getElementById('cfg-lookback').value),
    rest_days: getSelected('cfg-rest'),
    lsd_days: getSelected('cfg-lsd'),
    note: document.getElementById('cfg-note').value.trim(),
    lang: _lang
  };
  fetch('/api/analyze-config', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(config) });
  _runJob('analyze', config);
}

initDayPicker('cfg-rest', [1,5]);
initDayPicker('cfg-lsd',  [0]);

// init lang from saved config
fetch('/api/analyze-config').then(r => r.ok ? r.json() : null).then(cfg => {
  if (cfg?.lang) setLang(cfg.lang);
  else setLang('zh');
}).catch(() => setLang('zh'));
