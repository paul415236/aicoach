<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Garmin 跑步訓練儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  MathJax = { tex: { inlineMath: [['$','$']] }, options: { skipHtmlTags: ['script','style'] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<script>
  Chart.defaults.font.family = "'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif";
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Noto Sans TC", "Noto Sans CJK TC", "Noto Sans CJK SC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; background: #0f1117; color: #e2e8f0; }
  header { padding: 16px 32px; border-bottom: 1px solid #2d3748; display: flex; align-items: center; gap: 32px; }
  header h1 { font-size: 1.4rem; color: #63b3ed; white-space: nowrap; }
  .tabs { display: flex; gap: 4px; }
  .tab { padding: 6px 18px; border-radius: 6px; cursor: pointer; color: #718096; font-size: .9rem; }
  .tab.active { background: #2a4a6b; color: #63b3ed; }
  .tab:hover:not(.active) { background: #1a202c; color: #e2e8f0; }
  .ctrl { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .btn { padding: 6px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: .85rem; font-family: inherit; transition: opacity .15s; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn-sync { background: #2d6a4f; color: #b7e4c7; }
  .btn-ai   { background: #2a4a6b; color: #90cdf4; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4a5568; }
  .status-dot.running { background: #f6ad55; animation: pulse .8s infinite alternate; }
  .status-dot.ok  { background: #68d391; }
  .status-dot.err { background: #fc8181; }
  @keyframes pulse { from { opacity:.4 } to { opacity:1 } }
  /* log console */
  #log-panel { background: #0d1117; border: 1px solid #2d3748; border-radius: 8px; padding: 12px 16px;
    font-family: monospace; font-size: .8rem; color: #a0aec0; max-height: 320px;
    overflow-y: auto; white-space: pre-wrap; display: none; margin-bottom: 16px; }
  .page { display: none; }
  .page.active { display: flex; }
  .layout { display: flex; height: calc(100vh - 61px); }

  /* 左側列表 */
  #list { width: 340px; overflow-y: auto; border-right: 1px solid #2d3748; }
  .run-item { padding: 14px 18px; border-bottom: 1px solid #1a202c; cursor: pointer; transition: background .15s; }
  .run-item:hover { background: #1a202c; }
  .run-item.active { background: #2a4a6b; border-left: 3px solid #63b3ed; }
  .run-item .date { font-size: .75rem; color: #718096; }
  .run-item .name { font-weight: 600; margin: 2px 0; }
  .run-item .stats { font-size: .8rem; color: #a0aec0; display: flex; gap: 12px; }

  /* 右側詳情 */
  #detail { flex: 1; padding: 24px 32px; overflow-y: auto; }
  #detail h2 { margin-bottom: 4px; }
  #detail .meta { color: #718096; font-size: .85rem; margin-bottom: 20px; display: flex; gap: 20px; flex-wrap: wrap; }
  #detail .meta span b { color: #e2e8f0; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .chart-box { background: #1a202c; border-radius: 10px; padding: 16px; }
  .chart-box h3 { font-size: .85rem; color: #a0aec0; margin-bottom: 12px; }
  .placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: #4a5568; font-size: 1rem; }

  /* AI 建議頁 */
  #ai-page { padding: 32px; overflow-y: auto; flex-direction: column; width: 100%; box-sizing: border-box; }
  #ai-page .meta-bar { color: #718096; font-size: .8rem; margin-bottom: 24px; }
  #ai-content h1,#ai-content h2,#ai-content h3 { color: #63b3ed; margin: 1.2em 0 .4em; }
  #ai-content p { line-height: 1.8; margin-bottom: .8em; color: #cbd5e0; }
  #ai-content ul,#ai-content ol { padding-left: 1.4em; margin-bottom: .8em; color: #cbd5e0; line-height: 1.8; }
  #ai-content table { border-collapse: collapse; width: 100%; margin-bottom: 1em; }
  #ai-content th { background: #2a4a6b; color: #63b3ed; padding: 8px 12px; text-align: left; }
  #ai-content td { padding: 7px 12px; border-bottom: 1px solid #2d3748; color: #cbd5e0; }
  #ai-content tr:hover td { background: #1a202c; }
  #ai-content code { background: #1a202c; padding: 2px 6px; border-radius: 4px; font-size: .85em; }
  #ai-content strong { color: #e2e8f0; }
</style>
</head>
<body>
<header>
  <h1>Garmin 跑步訓練儀表板</h1>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('training')">訓練紀錄</div>
    <div class="tab" onclick="switchTab('ai')">AI 教練建議</div>
  </div>
  <div class="ctrl">
    <div class="status-dot" id="status-dot"></div>
    <button class="btn btn-sync" id="btn-sync" onclick="runJob('sync')">🔄 同步 Garmin</button>
    <button class="btn btn-ai"   id="btn-ai"   onclick="runJob('analyze')">🤖 AI 分析</button>
  </div>
</header>
<div id="log-panel"></div>
<div id="training-page" class="page active" style="height:calc(100vh - 61px)">
  <div id="list"><div class="placeholder" style="padding:40px">載入中...</div></div>
  <div id="detail"><div class="placeholder">選擇左側活動查看詳細圖表</div></div>
</div>
<div id="ai-page" class="page">
  <div class="meta-bar" id="ai-meta"></div>
  <div id="ai-content"><div class="placeholder" style="padding:40px;color:#4a5568">載入中...</div></div>
</div>

<script>
let paceChart, hrChart, cadenceChart;

async function loadRuns() {
  const res = await fetch('/api/runs');
  const runs = await res.json();
  const list = document.getElementById('list');
  list.innerHTML = '';
  runs.forEach(r => {
    const el = document.createElement('div');
    el.className = 'run-item';
    el.dataset.id = r.activity_id;
    el.innerHTML = `
      <div class="date">${r.date}</div>
      <div class="name">${r.name}</div>
      <div class="stats">
        <span>📏 ${r.distance_km} km</span>
        <span>⏱ ${r.duration_mins} min</span>
        <span>💓 ${r.avg_hr ?? '--'} bpm</span>
      </div>`;
    el.addEventListener('click', () => loadDetail(r, el));
    list.appendChild(el);
  });
}

async function loadDetail(run, el) {
  document.querySelectorAll('.run-item').forEach(e => e.classList.remove('active'));
  el.classList.add('active');

  const res = await fetch(`/api/runs/${run.activity_id}/splits`);
  const splits = await res.json();

  const detail = document.getElementById('detail');
  detail.innerHTML = `
    <h2>${run.name}</h2>
    <div class="meta">
      <span>📅 <b>${run.date}</b></span>
      <span>📏 <b>${run.distance_km} km</b></span>
      <span>⏱ <b>${run.duration_mins} min</b></span>
      <span>💓 平均 <b>${run.avg_hr ?? '--'}</b> / 最大 <b>${run.max_hr ?? '--'}</b> bpm</span>
      <span>🏃 配速 <b>${run.avg_pace}</b></span>
      <span>👟 步頻 <b>${run.avg_cadence ?? '--'}</b> spm</span>
      ${run.training_effect ? `<span>⚡ 訓練效果 <b>${run.training_effect}</b></span>` : ''}
    </div>
    <div class="charts">
      <div class="chart-box"><h3>每圈配速 (分:秒/km)</h3><canvas id="cPace"></canvas></div>
      <div class="chart-box"><h3>每圈平均心率 (bpm)</h3><canvas id="cHR"></canvas></div>
      <div class="chart-box"><h3>每圈步頻 (spm)</h3><canvas id="cCad"></canvas></div>
      <div class="chart-box"><h3>綜合數據 (配速 / 心率 / 步頻)</h3><canvas id="cDist"></canvas></div>
    </div>`;

  if (!splits.length) return;

  const labels = splits.map(s => `圈 ${s.lap}`);
  const paceToSec = p => {
    if (!p || p === 'N/A') return null;
    const [m, s] = p.split(':').map(Number);
    return m * 60 + s;
  };
  const secToLabel = s => s ? `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}` : null;

  const chartOpts = (color) => ({
    responsive: true,
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { color: '#718096' }, grid: { color: '#2d3748' } },
      y: { ticks: { color: '#718096' }, grid: { color: '#2d3748' } }
    }
  });

  // 配速（y軸反轉，數字越小配速越快）
  const paceSecs = splits.map(s => paceToSec(s.avg_pace));
  const maxPace = Math.max(...paceSecs.filter(Boolean));
  new Chart(document.getElementById('cPace'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: paceSecs,
        backgroundColor: '#63b3ed88',
        borderColor: '#63b3ed',
        borderWidth: 1
      }]
    },
    options: {
      ...chartOpts('#63b3ed'),
      scales: {
        x: { ticks: { color: '#718096' }, grid: { color: '#2d3748' } },
        y: {
          min: 0,
          max: Math.ceil(maxPace / 60) * 60,
          ticks: { color: '#718096', callback: v => secToLabel(v) },
          grid: { color: '#2d3748' }
        }
      }
    }
  });

  new Chart(document.getElementById('cHR'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: splits.map(s => s.avg_hr),
        borderColor: '#fc8181',
        backgroundColor: '#fc818133',
        tension: 0.3,
        fill: true,
        pointRadius: 4
      }]
    },
    options: chartOpts('#fc8181')
  });

  new Chart(document.getElementById('cCad'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: splits.map(s => s.avg_cadence),
        borderColor: '#68d391',
        backgroundColor: '#68d39133',
        tension: 0.3,
        fill: true,
        pointRadius: 4
      }]
    },
    options: chartOpts('#68d391')
  });

  new Chart(document.getElementById('cDist'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: '配速 (秒/km)',
          type: 'bar',
          data: paceSecs,
          backgroundColor: '#63b3ed55',
          borderColor: '#63b3ed',
          borderWidth: 1,
          yAxisID: 'yPace'
        },
        {
          label: '心率 (bpm)',
          data: splits.map(s => s.avg_hr),
          borderColor: '#fc8181',
          backgroundColor: 'transparent',
          tension: 0.3,
          pointRadius: 4,
          yAxisID: 'yHR'
        },
        {
          label: '步頻 (spm)',
          data: splits.map(s => s.avg_cadence),
          borderColor: '#68d391',
          backgroundColor: 'transparent',
          tension: 0.3,
          pointRadius: 4,
          yAxisID: 'yHR'
        }
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#a0aec0', boxWidth: 12 } } },
      scales: {
        x: { ticks: { color: '#718096' }, grid: { color: '#2d3748' } },
        yPace: {
          position: 'left',
          min: 0,
          max: Math.ceil(maxPace / 60) * 60,
          ticks: { color: '#63b3ed', callback: v => secToLabel(v) },
          grid: { color: '#2d3748' }
        },
        yHR: {
          position: 'right',
          ticks: { color: '#a0aec0' },
          grid: { display: false }
        }
      }
    }
  });
}

loadRuns();

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', ['training','ai'][i] === tab));
  document.getElementById('training-page').classList.toggle('active', tab === 'training');
  document.getElementById('ai-page').classList.toggle('active', tab === 'ai');
  if (tab === 'ai') loadAIPlan();
}

async function loadAIPlan() {
  const res = await fetch('/api/ai-plan');
  const data = await res.json();
  if (!data.content) {
    document.getElementById('ai-content').innerHTML = '<div class="placeholder" style="padding:40px;color:#4a5568">尚無 AI 分析，請點右上角「🤖 AI 分析」</div>';
    return;
  }
  document.getElementById('ai-meta').textContent = `最後更新：${data.generated_at}`;
  document.getElementById('ai-content').innerHTML = marked.parse(data.content);
  MathJax.typesetPromise([document.getElementById('ai-content')]);
}

async function runJob(type) {
  const dot = document.getElementById('status-dot');
  const panel = document.getElementById('log-panel');
  const btnSync = document.getElementById('btn-sync');
  const btnAI   = document.getElementById('btn-ai');

  dot.className = 'status-dot running';
  btnSync.disabled = btnAI.disabled = true;
  panel.style.display = 'block';
  panel.textContent = '';
  if (type === 'analyze') switchTab('ai');

  const appendLog = (line) => { panel.textContent += line + '\n'; panel.scrollTop = panel.scrollHeight; };

  try {
    const res = await fetch(`/api/${type}`, { method: 'POST' });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        if (part.startsWith('event: done')) {
          dot.className = 'status-dot ok';
          if (type === 'sync') loadRuns();
          if (type === 'analyze') loadAIPlan();
          setTimeout(() => { panel.style.display = 'none'; }, 3000);
        } else if (part.startsWith('data: ')) {
          appendLog(part.slice(6));
        }
      }
    }
  } catch (e) {
    appendLog(`❌ 連線錯誤: ${e}`);
    dot.className = 'status-dot err';
  } finally {
    btnSync.disabled = btnAI.disabled = false;
  }
}
</script>
</body>
</html>
